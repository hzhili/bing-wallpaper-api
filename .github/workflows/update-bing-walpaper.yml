name: update-bing-walpaper

on:
  schedule:
   - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout
       uses: actions/checkout@v6
       with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
     # Floating patch version on purpose: `ubuntu-latest` is migrating to
     # Ubuntu 26.04, and an exact pin like 3.12.12 has no build for that
     # image — setup-python dies with:
     #   The version '3.12.12' with architecture 'x64' was not found for Ubuntu 26.04.
     # '3.12' resolves to the newest 3.12.x that ships for the current runner.
     # setup-python v6 uses the node24 runtime (v5 targets deprecated node20).
     - name: Set up Python
       uses: actions/setup-python@v6
       with:
        cache: 'pip'
        python-version: '3.12'

     - name: Install Requirements
       run: |
         pip install -r requirements.txt
 
     - name: Update bing wallpaper
       working-directory: ./
       run: |
         python main.py
         
     - name: Commit and push json Files
       run: |
        if test -z "$(git status -s)"; then
          echo 'no commit'
          exit 0;
        else
          commit_message="自动拉取必应壁纸"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -a -m "${commit_message}"
          git push origin main
        fi
